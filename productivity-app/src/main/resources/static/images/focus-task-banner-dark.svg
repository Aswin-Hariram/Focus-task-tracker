<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 310" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="310" gradientUnits="userSpaceOnUse">
      <stop stop-color="#142F60"/>
      <stop offset=".5" stop-color="#091B3D"/>
      <stop offset="1" stop-color="#07162E"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#2563EB" stop-opacity=".42"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#182D58"/>
      <stop offset="1" stop-color="#091329"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#F5B57B"/>
      <stop offset="1" stop-color="#AD6754"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
  </defs>

  <g>
    <rect width="1200" height="310" fill="url(#bg)"/>
    <circle cx="100" cy="20" r="150" fill="#2563EB" opacity=".1" filter="url(#glow)"/>

    <!-- Background windows -->
    <g fill="#3264AC" opacity=".15">
      <rect x="655" y="34" width="116" height="65" rx="2"/>
      <rect x="782" y="34" width="116" height="65" rx="2"/>
