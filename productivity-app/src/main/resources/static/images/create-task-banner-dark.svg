<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 240"
     width="100%"
     role="img"
     aria-label="Create Task dark theme banner">
  <defs>
    <linearGradient id="darkBg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#172B4D"/>
      <stop offset=".6" stop-color="#142442"/>
      <stop offset="1" stop-color="#262451"/>
    </linearGradient>
    <linearGradient id="darkWave" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#1E3A70"/>
      <stop offset=".6" stop-color="#243E80"/>
      <stop offset="1" stop-color="#51428E"/>
    </linearGradient>
    <linearGradient id="darkClip" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4088FF"/>
      <stop offset="1" stop-color="#2350AE"/>
    </linearGradient>
    <filter id="darkShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="7"
                    flood-color="#020617" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="240" rx="18" fill="url(#darkBg)"/>
  <circle cx="1040" cy="0" r="205" fill="#4F46E5" opacity=".09"/>
  <circle cx="740" cy="170" r="170" fill="#2563EB" opacity=".08"/>
  <path d="M0 200 Q170 152 340 205 T700 192 T1030 157 T1200 189 V240 H0Z"
        fill="#254777" opacity=".42"/>
  <path d="M470 240 Q680 195 805 178 T1050 180 T1200 150 V240Z"
        fill="url(#darkWave)" opacity=".7"/>
  <path d="M900 240 Q1040 195 1200 216 V240Z"
        fill="#6366F1" opacity=".2"/>

  <!-- Decorative dots -->
  <g fill="#93A8D4" opacity=".3">
    <circle cx="690" cy="35" r="1.5"/>
    <circle cx="705" cy="35" r="1.5"/>
    <circle cx="720" cy="35" r="1.5"/>
    <circle cx="735" cy="35" r="1.5"/>
    <circle cx="750" cy="35" r="1.5"/>
    <circle cx="690" cy="50" r="1.5"/>
    <circle cx="705" cy="50" r="1.5"/>
    <circle cx="720" cy="50" r="1.5"/>
    <circle cx="735" cy="50" r="1.5"/>
    <circle cx="750" cy="50" r="1.5"/>
  </g>

  <!-- Books -->
  <g filter="url(#darkShadow)">
    <rect x="990" y="206" width="99" height="15" rx="4" fill="#3972DA"/>
    <rect x="998" y="192" width="91" height="15" rx="4"
          fill="#DCE7FF" stroke="#5B7DC7" stroke-width="2"/>
    <rect x="994" y="179" width="93" height="13" rx="4" fill="#F59E0B"/>
  </g>

  <!-- Plant -->
  <g transform="translate(760 129)">
    <path d="M32 62 Q-8 28 8 0 Q39 12 32 62Z" fill="#3FA777"/>
    <path d="M33 62 Q20 12 53 -12 Q69 22 33 62Z" fill="#63C995"/>
    <path d="M34 62 Q50 15 83 25 Q70 55 34 62Z" fill="#238B75"/>
    <path d="M33 62 Q5 40 -12 37 Q-8 61 33 62Z" fill="#4CBF8E"/>
    <path d="M33 62 L34 5 M33 62 L53 9 M33 62 L66 37"
          stroke="#1F765D" stroke-width="2" fill="none"/>
    <path d="M10 65 H60 L54 104 Q35 112 17 104Z" fill="#3769C4"/>
    <rect x="8" y="62" width="54" height="9" rx="4" fill="#548BE8"/>
  </g>

  <!-- Calendar -->
  <g transform="translate(854 118)" filter="url(#darkShadow)">
    <rect x="0" y="14" width="84" height="91" rx="8"
          fill="#E8EEFF" stroke="#6585C7" stroke-width="2"/>
    <rect x="0" y="14" width="84" height="22" rx="7" fill="#F59E0B"/>
    <path d="M17 7 V22 M68 7 V22" stroke="#3B67BD"
          stroke-width="6" stroke-linecap="round"/>
    <g fill="#B9CBEC">
      <rect x="11" y="46" width="10" height="10" rx="2"/>
      <rect x="28" y="46" width="10" height="10" rx="2"/>
      <rect x="45" y="46" width="10" height="10" rx="2"/>
      <rect x="62" y="46" width="10" height="10" rx="2"/>
      <rect x="11" y="62" width="10" height="10" rx="2"/>
      <rect x="28" y="62" width="10" height="10" rx="2"/>
      <rect x="62" y="62" width="10" height="10" rx="2"/>
      <rect x="11" y="78" width="10" height="10" rx="2"/>
      <rect x="28" y="78" width="10" height="10" rx="2"/>
      <rect x="45" y="78" width="10" height="10" rx="2"/>
      <rect x="62" y="78" width="10" height="10" rx="2"/>
    </g>
    <rect x="45" y="62" width="10" height="10" rx="2" fill="#F59E0B"/>
  </g>

  <!-- Checklist clipboard -->
  <g transform="translate(959 27)" filter="url(#darkShadow)">
    <rect x="0" y="16" width="146" height="185" rx="12"
          fill="url(#darkClip)"/>
    <rect x="9" y="25" width="128" height="164" rx="7"
          fill="#EAF1FF"/>
    <rect x="43" y="8" width="61" height="25" rx="8"
          fill="#609BFF"/>
    <circle cx="73" cy="12" r="8" fill="#609BFF"/>
    <circle cx="73" cy="12" r="3.5" fill="#EAF1FF"/>

    <g fill="#10B981">
      <rect x="24" y="61" width="24" height="24" rx="6"/>
      <rect x="24" y="101" width="24" height="24" rx="6"/>
      <rect x="24" y="141" width="24" height="24" rx="6"/>
    </g>
    <g stroke="#FFFFFF" stroke-width="3" fill="none"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M30 73 l5 5 8 -10"/>
      <path d="M30 113 l5 5 8 -10"/>
      <path d="M30 153 l5 5 8 -10"/>
    </g>
    <g fill="#A9BCDE">
      <rect x="58" y="65" width="61" height="6" rx="3"/>
      <rect x="58" y="105" width="61" height="6" rx="3"/>
      <rect x="58" y="145" width="61" height="6" rx="3"/>
    </g>
    <g fill="#CFDBF0">
      <rect x="58" y="78" width="43" height="5" rx="2.5"/>
      <rect x="58" y="118" width="43" height="5" rx="2.5"/>
      <rect x="58" y="158" width="43" height="5" rx="2.5"/>
    </g>
  </g>

  <!-- Target -->
  <g transform="translate(1125 88)" filter="url(#darkShadow)">
    <circle cx="25" cy="28" r="42" fill="#F59E0B"/>
    <circle cx="25" cy="28" r="32" fill="#243D70"/>
    <circle cx="25" cy="28" r="23" fill="#FBBF24"/>
    <circle cx="25" cy="28" r="13" fill="#243D70"/>
    <circle cx="25" cy="28" r="6" fill="#F59E0B"/>
    <path d="M25 28 L58 -11" stroke="#93C5FD"
          stroke-width="4" stroke-linecap="round"/>
    <path d="M56 -11 L69 -16 L65 -2Z" fill="#F59E0B"/>
  </g>
</svg>
