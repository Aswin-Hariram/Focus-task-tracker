spring.application.name=personal-productivity-tracker
server.port=${SERVER_PORT:8484}

# The main launcher overrides these values with its bundled PostgreSQL instance.
# They remain configurable for an externally managed PostgreSQL server.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/productivity_tracker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/vendor/{vendor}
spring.thymeleaf.cache=false

app.storage.root=${APP_STORAGE_ROOT:./storage}
app.storage.default-location=${APP_STORAGE_DEFAULT_LOCATION:${user.home}/Documents}
app.seed-demo-data=${APP_SEED_DEMO_DATA:true}

# Task attachments and task completion files can be of any size.
spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1
server.error.include-message=never
server.error.include-stacktrace=never

# Security Hardening (Anthropic Cybersecurity Skills: performing-security-headers-audit, performing-csrf-attack-simulation)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.server-header=
app.security.csrf.enabled=${APP_SECURITY_CSRF_ENABLED:true}
